  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゆっくり観察</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f4ef; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; left: 12px; bottom: 10px;
        font: 12px/1.5 system-ui, sans-serif; color: #8a7a6a;
        pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">左ドラッグ：回転 ／ 右ドラッグ：移動 ／ ホイール：拡大縮小 ／ Ctrl＋ドラッグ：地面の下まで回す<br>ゆっくりをクリック：つつく ／ Shift＋クリック：叩く ／ 地面をクリック：行き先を決める</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
